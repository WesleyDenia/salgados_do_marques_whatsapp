services:
  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salgados-whatsapp
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      WHATSAPP_INTERNAL_TOKEN_FILE: /run/secrets/whatsapp_token
      WHATSAPP_BACKEND_URL: http://nginx/api/v1/webhooks/whatsapp/messages
    shm_size: 1gb
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - whatsapp_token
    networks:
      - backend

volumes:
  whatsapp_session:

secrets:
  whatsapp_token:
    file: ./secrets/whatsapp_token.txt

networks:
  backend:
    external: true
    name: salgados_backend_net
