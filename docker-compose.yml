services:
  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salgados-whatsapp
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      WHATSAPP_INTERNAL_TOKEN_FILE: /run/secrets/whatsapp_token
    shm_size: 1gb
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
    secrets:
      - whatsapp_token

volumes:
  whatsapp_session:

secrets:
  whatsapp_token:
    file: ./secrets/whatsapp_token.txt
